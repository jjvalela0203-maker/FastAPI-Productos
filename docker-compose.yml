services:
  # Servicio 1: La Base de Datos
  db:
    image: postgres:15-alpine
    volumes:
      # Esto enlaza la carpeta interna donde Postgres guarda datos con un volumen seguro
      - pg_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio 2: Tu API
  api:
    build: . # Le dice a Docker que busque el 'Dockerfile' en esta misma carpeta
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
        db: 
          condition: service_healthy # Esto asegura que la API solo se inicie cuando la base de datos esté lista
volumes:
  pg_data: